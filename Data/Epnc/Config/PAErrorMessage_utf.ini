E1=A tool is detected, but it's tool number was not recorded.\n\nPlease manually remove the tool before proceeding.
E2=Tool is not detected.\n\nPlease check the tool's status.
E3=Thre is a problem with the setting value. The value should be between 1~100 or 1~20.\n\nPlease check the value before proceeding.
E4=Water flow sensor does not report water flow even though is should.\n\n* Check the amount of the coolant.\n* Check the water tank is attached correctly.\n* Verify correct operation of the water flow sensor.\n\nIf the problem persists, contact your dealer.
E5=The door OPEN sensor did not sense the opened door after door open command.\nThis may refer to:\n* ATC door\n* Side door between milling chamber and autoloader\n\n* Verify the air pressure supply.\n* Verify correct function of DOOR OPEN sensor.
E6=The door CLOSED sensor did not sense the closed door after door close command.\nThis may refer to:\n* ATC door\n* Side door between milling chamber and autoloader\n\n* Verify the air pressure supply.\n* Verify correct function of DOOR CLOSED sensor.
E7=There was a problem operating the pump.\n\nPlease check connection of the pump.
E8=There was a problem operating the pump.\n\nPlease check connection of the pump.
E9=Tool detected even though the tool number is zero.\nPossible causes:\n* A tool was inserted manually in the collet.\n* The temporary status files have changed\n\nRemove the tool by opening the collet and remove it manually.
E10=No tool detected after GET TOOL. The ATC pocket was empty or there is a problem with the clamping mechanism.\n\n* Try getting the tools by pressing "Get Tool" buttons from the "Tools" screen.\n* Inspect the clamping mechanism.
E11=There was no tool length measurement when expected. The tool is not long enough or there is no tool.\n\nCheck the status of the clamped tool (length, condition).
E12=An impact has been detected during tool change operations. This might be caused by wrong "Auto Teaching" data.\n\n* Check for possible collisions around ATC.\n* Check positions of all tools in the ATC.\n* Perform "Auto Calibration" and "Auto Teaching".
E13=There was a problem during calibration.\n\nPlease check if the calibration tool is installed properly.
E14=No tool was detected when expected. The tool has been broken during operation or removed in abnormal way.\n\n* Inspect the clamped tool, if there is any.\n* Inspect the collet.\n* Replace the broken tool.\n* Reset the tool number in the "Tools" screen.
E15=Communication error with the IO Board has been detected.\n\nPlease check the IP setting of the IO Board.\n\nIf the issue persists, pleace contact your dealer.
